[package]
name = "power-status"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
russh = "0.63.1"
russh-sftp = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
surge-ping = "0.9.0"
tapo = "0.9.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
